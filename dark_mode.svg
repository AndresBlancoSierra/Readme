<text x="271.2" y="25" fill="#d9ffe2" font-size="16" font-family="Consolas,Menlo,monospace"><tspan x="271.2" y="25" class="glitch" fill="#00ff41">andres@arch</tspan><tspan class="cursor" fill="#39ff14">▌</tspan><tspan fill="#00cc33"> ─────────────────────────────</tspan><tspan x="271.2" y="55" fill="#00cc33">.</tspan><tspan fill="#00ff41">OS</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Arch Linux + Hyprland</tspan><tspan x="271.2" y="79" fill="#00cc33">.</tspan><tspan fill="#00ff41">WM</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Hyprland (Wayland)</tspan><tspan x="271.2" y="103" fill="#00cc33">.</tspan><tspan fill="#00ff41">Shell</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">bash/zsh</tspan><tspan x="271.2" y="127" fill="#00cc33">.</tspan><tspan fill="#00ff41">Role</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Systems Engineer — EAN, Bogotá</tspan><tspan x="271.2" y="151" fill="#00cc33">.</tspan><tspan fill="#00ff41">English</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">B2</tspan><tspan x="271.2" y="175" fill="#00cc33">.</tspan><tspan fill="#00ff41">Languages</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Python · TypeScript · C++ · Bash</tspan><tspan x="271.2" y="199" fill="#00cc33">.</tspan><tspan fill="#00ff41">AI/ML</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Whisper · CLIP · OCR · InsightFace</tspan><tspan x="271.2" y="223" fill="#00cc33">.</tspan><tspan fill="#00ff41">Backend</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">FastAPI · SQLAlchemy</tspan><tspan x="271.2" y="247" fill="#00cc33">.</tspan><tspan fill="#00ff41">Frontend</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">React · Vite · Tailwind</tspan><tspan x="271.2" y="271" fill="#00cc33">.</tspan><tspan fill="#00ff41">DevOps</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Docker · systemd · GitHub Actions</tspan><tspan x="271.2" y="295" fill="#00cc33">.</tspan><tspan fill="#00ff41">Hardware</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Arduino · uinput · Wine</tspan><tspan x="271.2" y="319" fill="#00cc33">.</tspan><tspan fill="#00ff41">Focus</tspan><tspan fill="#00cc33">: </tspan><tspan fill="#d9ffe2">Applied AI + cyberpunk aesthetics</tspan><tspan x="271.2" y="349" fill="#00ff41"> ─── GitHub Stats ───</tspan><tspan x="271.2" y="373" fill="#00cc33">.</tspan><tspan fill="#00ff41">Repos</tspan><tspan fill="#00cc33">:   23</tspan><tspan fill="#00cc33">   </tspan><tspan fill="#00ff41">Stars</tspan><tspan fill="#00cc33">:    0</tspan><tspan x="271.2" y="397" fill="#00cc33">.</tspan><tspan fill="#00ff41">Followers</tspan><tspan fill="#00cc33">:    0</tspan><tspan fill="#00cc33">   </tspan><tspan fill="#00ff41">Status</tspan><tspan fill="#39ff14">: OPEN TO WORK</tspan></text>
