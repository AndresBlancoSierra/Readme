<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .signal{ fill: #7da2c9; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
</defs>

<rect width="720" height="320" fill="#050505"/>
<rect x="1" y="1" width="718" height="318" fill="none" stroke="#1f1f23" stroke-width="1"/>

<text x="24" y="28" xml:space="preserve">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$ </tspan>
  <tspan class="fg"># contact</tspan>
</text>
<rect class="caret" x="267" y="15" width="2" height="13" fill="#71717a"/>
<rect x="24" y="68" width="640" height="1" fill="#2e2e33"/>

<text x="24" y="116"><tspan class="dim">EMAIL</tspan><tspan class="muted" x="180">andresfelipeblancos15@gmail.com</tspan></text>
<text x="24" y="152"><tspan class="dim">WEB</tspan><tspan class="muted" x="180">andresblanco.site</tspan></text>
<text x="24" y="188"><tspan class="dim">GITHUB</tspan><tspan class="muted" x="180">github.com/AndresBlancoSierra</tspan></text>
<text x="24" y="224"><tspan class="dim">STATUS</tspan><tspan class="signal" x="180">open to work worldwide</tspan></text>

<rect x="24" y="266" width="640" height="1" fill="#2e2e33"/>

<text x="24" y="302" xml:space="preserve">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$</tspan>
</text>
<rect class="caret" x="177" y="289" width="2" height="13" fill="#71717a"/>
</svg>