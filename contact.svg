<svg xmlns="http://www.w3.org/2000/svg" width="560" height="230" viewBox="0 0 560 230" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .signal{ fill: #7da2c9; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
</defs>

<rect width="560" height="230" fill="#050505"/>
<rect x="1" y="1" width="558" height="228" fill="none" stroke="#1f1f23" stroke-width="1"/>

<text x="24" y="24">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$ </tspan>
  <tspan class="fg"># contact</tspan>
</text>
<rect x="24" y="42" width="512" height="1" fill="#2e2e33"/>

<text x="24" y="70"><tspan class="dim">EMAIL</tspan><tspan class="muted" x="132">andresfelipeblancos15@gmail.com</tspan></text>
<text x="24" y="98"><tspan class="dim">LOCATION</tspan><tspan class="muted" x="132">Bogotá, Colombia · open to remote</tspan></text>
<text x="24" y="126"><tspan class="dim">WEB</tspan><tspan class="muted" x="132"><a href="https://andresblanco.site">andresblanco.site</a></tspan></text>
<text x="24" y="154"><tspan class="dim">GITHUB</tspan><tspan class="muted" x="132"><a href="https://github.com/AndresBlancoSierra">github.com/AndresBlancoSierra</a></tspan></text>
<text x="24" y="182"><tspan class="dim">STATUS</tspan><tspan class="signal" x="132">open to work worldwide</tspan></text>

<rect x="24" y="210" width="512" height="1" fill="#2e2e33"/>
</svg>
