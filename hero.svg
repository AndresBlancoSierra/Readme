<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .signal{ fill: #7da2c9; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  .star  { animation: twinkle 5s ease-in-out infinite; }
  .starb { animation: twinkle 7s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.7; } }
  @media (prefers-reduced-motion: reduce) {
    .caret, .star, .starb { animation: none !important; }
  }
</style>
</defs>

<rect width="720" height="460" fill="#050505"/>
<rect x="1" y="1" width="718" height="458" fill="none" stroke="#1f1f23" stroke-width="1"/>

<g class="faint">
  <circle class="star"  cx="48"  cy="40"  r="0.9"/>
  <circle class="starb" cx="68"  cy="300" r="1.1"/>
