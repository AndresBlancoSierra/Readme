  <circle class="starb" cx="640" cy="55"  r="1.1"/>
  <circle class="star"  cx="690" cy="340" r="0.9"/>
  <circle class="starb" cx="700" cy="150" r="1.1"/>
  <circle class="star"  cx="620" cy="420" r="0.9"/>
  <circle class="starb" cx="60"  cy="120" r="1.1"/>
</g>

<text class="faint" x="24" y="100">
