<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
</defs>

<rect width="720" height="306" fill="#050505"/>
<rect x="1" y="1" width="718" height="304" fill="none" stroke="#1f1f23" stroke-width="1"/>

