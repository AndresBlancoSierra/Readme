  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$ </tspan>
  <tspan class="fg">ls ~/projects</tspan>
</text>
<rect x="24" y="45" width="640" height="1" fill="#2e2e33"/>

<g>
  <text x="24" y="76"><tspan class="dim">▸</tspan><tspan class="fg"><a href="https://github.com/AndresBlancoSierra/what">what</a></tspan><tspan class="muted" x="360">Learn with songs</tspan></text>
  <text x="24" y="108"><tspan class="dim">▸</tspan><tspan class="fg"><a href="https://github.com/AndresBlancoSierra/english-capture">english-capture</a></tspan><tspan class="muted" x="360">OCR text capture</tspan></text>
  <text x="24" y="140"><tspan class="dim">▸</tspan><tspan class="fg"><a href="https://github.com/AndresBlancoSierra/portrait-dataset-builder">portrait-dataset-builder</a></tspan><tspan class="muted" x="360">Face detection + CLIP</tspan></text>
  <text x="24" y="172"><tspan class="dim">▸</tspan><tspan class="fg"><a href="https://github.com/AndresBlancoSierra/guitar-hero-controller">guitar-hero-controller</a></tspan><tspan class="muted" x="360">Arduino + Linux uinput</tspan></text>
  <text x="24" y="204"><tspan class="dim">▸</tspan><tspan class="fg"><a href="https://github.com/AndresBlancoSierra/cp2077-ui-react">cp2077-ui-react</a></tspan><tspan class="muted" x="360">CP2077 UI in React</tspan></text>
