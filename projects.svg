<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
</defs>

<rect width="720" height="350" fill="#050505"/>
<rect x="1" y="1" width="718" height="348" fill="none" stroke="#1f1f23" stroke-width="1"/>

<text x="24" y="28" xml:space="preserve">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$ </tspan>
  <tspan class="fg">ls ~/projects</tspan>
</text>
<rect class="caret" x="303" y="15" width="2" height="13" fill="#71717a"/>
<rect x="24" y="68" width="640" height="1" fill="#2e2e33"/>

<g>
  <text x="24" y="112"><tspan class="dim">▸</tspan><tspan class="fg">what</tspan><tspan class="muted" x="360">Learn with songs</tspan></text>
  <text x="24" y="144"><tspan class="dim">▸</tspan><tspan class="fg">english-capture</tspan><tspan class="muted" x="360">OCR text capture</tspan></text>
  <text x="24" y="176"><tspan class="dim">▸</tspan><tspan class="fg">portrait-dataset-builder</tspan><tspan class="muted" x="360">Face detection + CLIP</tspan></text>
  <text x="24" y="208"><tspan class="dim">▸</tspan><tspan class="fg">guitar-hero-controller</tspan><tspan class="muted" x="360">Arduino + Linux uinput</tspan></text>
  <text x="24" y="240"><tspan class="dim">▸</tspan><tspan class="fg">cp2077-ui-react</tspan><tspan class="muted" x="360">CP2077 UI in React</tspan></text>
  <text x="24" y="272"><tspan class="dim">▸</tspan><tspan class="fg">opencode-telegram-controller</tspan><tspan class="muted" x="360">Control OpenCode from Telegram</tspan></text>
</g>

<rect x="24" y="296" width="640" height="1" fill="#2e2e33"/>

<text x="24" y="332" xml:space="preserve">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$</tspan>
</text>
<rect class="caret" x="177" y="319" width="2" height="13" fill="#71717a"/>
