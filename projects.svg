  .line  { fill: #2e2e33; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
