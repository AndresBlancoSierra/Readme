<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="15">
<defs>
<style>
  text { white-space: pre; }
  .fg    { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .dim   { fill: #71717a; }
  .faint { fill: #52525b; }
  .line  { fill: #2e2e33; }
  .caret { animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none !important; }
  }
</style>
</defs>

<rect width="720" height="404" fill="#050505"/>
<rect x="1" y="1" width="718" height="402" fill="none" stroke="#1f1f23" stroke-width="1"/>

<text x="24" y="24">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$ </tspan>
  <tspan class="fg">tree system/</tspan>
</text>
<rect x="24" y="42" width="672" height="1" fill="#2e2e33"/>

<text x="24" y="70"><tspan class="fg">system/</tspan></text>
<text x="24" y="98"><tspan class="faint">├── </tspan><tspan class="fg">education</tspan></text>
<text x="24" y="126"><tspan class="faint">│   └── </tspan><tspan class="muted">b.s. systems engineering — universidad ean (2023 → 2027)</tspan></text>
<text x="24" y="154"><tspan class="faint">├── </tspan><tspan class="fg">domains</tspan></text>
<text x="24" y="182"><tspan class="faint">│   ├── </tspan><tspan class="fg">software</tspan><tspan class="dim" x="195">·</tspan><tspan class="muted" x="204">end-to-end systems</tspan></text>
<text x="24" y="210"><tspan class="faint">│   ├── </tspan><tspan class="fg">cloud</tspan><tspan class="dim" x="195">·</tspan><tspan class="muted" x="204">aws · infrastructure</tspan></text>
<text x="24" y="238"><tspan class="faint">│   ├── </tspan><tspan class="fg">security</tspan><tspan class="dim" x="195">·</tspan><tspan class="muted" x="204">driven by design</tspan></text>
<text x="24" y="266"><tspan class="faint">│   └── </tspan><tspan class="fg">linux</tspan><tspan class="dim" x="195">·</tspan><tspan class="muted" x="204">environments as systems</tspan></text>
<text x="24" y="294"><tspan class="faint">└── </tspan><tspan class="fg">focus</tspan></text>
<text x="24" y="322"><tspan class="faint">    └── </tspan><tspan class="muted">i build systems. i study how they work.</tspan></text>

<rect x="24" y="350" width="672" height="1" fill="#2e2e33"/>
<text x="24" y="378">
  <tspan class="muted">andres@blanco</tspan>
  <tspan class="dim">:~$</tspan>
</text>
<rect class="caret" x="183" y="365" width="2" height="13" fill="#71717a"/>
</svg>
